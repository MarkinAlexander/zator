name: deploy-tar

# Ручная сборка релизных архивов развёртывания (zator-core/webui/full).
# Автозапуска нет: только workflow_dispatch.
#
# Релизы:
#   latest — rolling, тег latest, пересоздаётся (prerelease), его качает
#            лаунчер при обычном режиме (stable URL releases/download/latest/...);
#   <version> — неизменяемый номерной (deploy-YYYYMMDD-HHMM или ручной номер),
#            для пина/отката (stable URL releases/download/<tag>/...).
#
# Ассеты каждого релиза: zator-<variant>.tar.gz + .sha256 + .manifest.json +
# .manifest.tsv + latest.json (указатель сборки с размерами для проверки
# свободного места на устройстве).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер релиза (пусто = deploy-<UTC таймстамп>)'
        required: false
        default: ''
      update_latest:
        description: 'Обновить rolling-релиз latest'
        type: boolean
        required: false
        default: true
      make_numbered:
        description: 'Создать неизменяемый номерной релиз'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack variants
        working-directory: webui-src
        env:
          VERSION_ARG: ${{ inputs.version }}
        run: node scripts/pack-zator-tar.mjs --variant=all --repo "$GITHUB_REPOSITORY" ${VERSION_ARG:+--version="$VERSION_ARG"}

      - name: Verify outputs
        run: |
          cd webui-src/dist
          for v in core webui full; do
            test -s "zator-$v.tar.gz"
            sha256sum -c "zator-$v.sha256"
            test -s "zator-$v.manifest.tsv"
          done
          test -s latest.json
          node -e '
            const m = require("./latest.json");
            if (m.schemaVersion !== 1) process.exit(1);
            for (const v of ["core", "webui", "full"]) {
              const a = m.assets[v];
              if (!a || !a.size || !a.sha256 || !a.unpackedSize || !a.url) process.exit(1);
            }'

      - name: Release version tag
        id: rel
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=deploy-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Recreate rolling release latest
        if: ${{ inputs.update_latest }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest webui-src/dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "zator deploy (rolling latest)" \
            --notes "Развёртываемые архивы zator. Сборка: $TAG, commit $GITHUB_SHA. Rolling-релиз, ассеты обновляются при каждой ручной сборке."

      - name: Create numbered release
        if: ${{ inputs.make_numbered }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — пропускаю (номерные релизы неизменяемы)." >&2
            exit 1
          fi
          gh release create "$TAG" webui-src/dist/* \
            --target "$GITHUB_SHA" \
            --title "zator deploy $TAG" \
            --notes "Неизменяемый релиз развёртываемых архивов. commit $GITHUB_SHA. Установка конкретной версии: z2r --version=$TAG."
